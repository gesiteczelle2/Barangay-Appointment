<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg: #07111f;
            --bg-2: #0d1b2a;
            --panel: rgba(15, 23, 42, 0.92);
            --line: rgba(103, 232, 249, 0.35);
            --cyan: #67e8f9;
            --text: #eafcff;
            --muted: #a8d6e5;
            --shadow: 0 0 24px rgba(103, 232, 249, 0.18);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 28%),
                linear-gradient(135deg, var(--bg), var(--bg-2));
            color: var(--text);
        }

        .login-box {
            width: min(92vw, 440px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 32px 28px;
        }

        h2 {
            margin: 0 0 12px;
            color: var(--cyan);
            text-align: center;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            text-align: center;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(10, 18, 31, 0.9);
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: rgba(103, 232, 249, 0.85);
            box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.18);
        }

        button {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--cyan), #7dd3fc);
            color: #07111f;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(103, 232, 249, 0.4);
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            text-align: center;
            width: 100%;
            color: var(--cyan);
            text-decoration: none;
            font-weight: 700;
        }

        .errorlist {
            color: #fca5a5;
            list-style: none;
            padding: 0;
            margin: 0 0 10px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>System Login</h2>
        <p>Access your barangay appointment dashboard</p>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <ul class="errorlist">
                    {% for error in form.non_field_errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <div>
                <label for="id_username">Username</label>
                {{ form.username }}
            </div>

            <div>
                <label for="id_password">Password</label>
                {{ form.password }}
            </div>

            <button type="submit">Login</button>
        </form>

        <a class="back-link" href="{% url 'home' %}">← Back to Home</a>
    </div>
</body>
</html>
